spring:
  application:
    name: "eurekaserver"
  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health: # we must enable the readiness and liveness (checked before stating loans, accounts and cards services )
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  # Metrics-related settings (powered by Micrometer)
  metrics:
    # Tags (key-value pairs) attached to all collected metrics
    tags:
      # Adds an 'application' tag with the value of the service's name
      # This helps distinguish metrics in a multi-service environment
      application: ${spring.application.name}

logging:
  pattern:
    # Customizes the log line format (using Logback/Log4j pattern syntax)
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
    # Pattern breakdown:
    #   %5p            - Right-padded log level (e.g., "DEBUG", "ERROR") with 5 chars
    #   ${spring.application.name} - Inserts the application name from Spring config
    #   %X{trace_id}   - Adds distributed tracing ID (from Sleuth/OpenTelemetry)
    #   %X{span_id}    - Adds span ID for tracing within a single request flow
    #
    # Example output:
    #   DEBUG [account-service,80f9ee446ccf34b4,80f9ee446ccf34b4] - Some log message