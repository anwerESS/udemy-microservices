{{- define "common.deployment" -}}  # Reusable deployment template
apiVersion: apps/v1  # Kubernetes API version
kind: Deployment  # Resource type (manages Pods)
metadata:
  name: {{ .Values.deploymentName }}  # Deployment name from values
  labels:
    app: {{ .Values.appLabel }}  # Application label for selection
spec:
  replicas: {{ .Values.replicaCount }}  # Number of Pod replicas
  selector:  # Label selector for Pods
    matchLabels:
      app: {{ .Values.appLabel }}
  template:  # Pod template
    metadata:
      labels:
        app: {{ .Values.appLabel }}  # Must match selector
    spec:
      containers:
        - name: {{ .Values.appLabel }}  # Container name
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"  # Container image
          ports:
            - containerPort: {{ .Values.containerPort }}  # App listening port
              protocol: TCP
          env:  # Environment variables (conditionally included)
        {{- if .Values.appname_enabled }}  # Only if appname_enabled=true
            - name: SPRING_APPLICATION_NAME  # Spring app name
              value: {{ .Values.appName }}
        {{- end }}
        {{- if .Values.profile_enabled }}  # Profile configuration
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:  # References ConfigMap
                  name: {{ .Values.global.configMapName }}
                  key: SPRING_PROFILES_ACTIVE
        {{- end }}
        {{- if .Values.config_enabled }}  # Config Server integration
            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.global.configMapName }}
                  key: SPRING_CONFIG_IMPORT
        {{- end }}
        {{- if .Values.eureka_enabled }}  # Eureka service discovery
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.global.configMapName }}
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        {{- end }}
        {{- if .Values.resouceserver_enabled }}  # OAuth2 resource server
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.global.configMapName }}
                  key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI
        {{- end }}
        {{- if .Values.otel_enabled }}  # OpenTelemetry configuration
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.global.configMapName }}
                  key: JAVA_TOOL_OPTIONS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.global.configMapName }}
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.global.configMapName }}
                  key: OTEL_METRICS_EXPORTER
            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.global.configMapName }}
                  key: OTEL_LOGS_EXPORTER
            - name: OTEL_SERVICE_NAME  # Direct value (not from ConfigMap)
              value: {{ .Values.appName }}
        {{- end }}
        {{- if .Values.kafka_enabled }}  # Kafka integration
            - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.global.configMapName }}
                  key: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
        {{- end }}
{{- end -}}  # Ends template



{{/*
===================================================================
Key Features of This Helm Chart:
Modular Design:

  Uses define to create reusable templates

  All configurations driven by values.yaml

Conditional Features:

  Features like OpenTelemetry, Kafka, Eureka can be toggled

Example: {{- if .Values.otel_enabled }}

Configuration Management:

  Centralized ConfigMap with common settings

  Services reference the same ConfigMap

Best Practices:

  Clear separation of concerns (config vs deployment vs service)

  Parameterized all values (no hardcoding)

Observability Ready:

  Built-in OpenTelemetry support

  Configurable metrics and logs exporters

  To use these templates, you would {{- include "common.configmap" . }} in your main templates. The actual values would come from your values.yaml file or overrides during helm install.
===================================================================
*/}}