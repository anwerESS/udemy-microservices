########## Spring Application:
#
#  Sets the application name to gatewayserver.
#
#  Configures the application to fetch configuration from the Config Server at http://localhost:8071/. The optional flag ensures the application starts even if the Config Server is unavailable.
spring:
  application:
    name: "gatewayserver"  # Sets the name of the Spring Boot application to "gatewayserver".
    # This is used for identification in logs, service discovery, and configuration management.

  config:
    import: "optional:configserver:http://localhost:8071/"  # Configures the application to fetch configuration from the Config Server.
      # - "optional": The application will start even if the Config Server is unavailable.
    # - "configserver:http://localhost:8071/": The URL of the Config Server.
  ######## Spring Cloud Gateway:
  #
  #  Disables the Gateway Discovery Locator (automatic routing based on service discovery).
  #
  #  Ensures service IDs are lowercase if the Discovery Locator is enabled.
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true  # enable or disable the Gateway Discovery Locator, which automatically routes requests based on service discovery.
          lowerCaseServiceId: true  # Converts service IDs to lowercase when using the Discovery Locator (if enabled).
      httpclient:
        connect-timeout: 1000 # maximum time the HTTP client will wait to establish a connection with a remote server.
        response-timeout: 10s # maximum time the HTTP client will wait for a response after the connection is established.
  data:
    redis:
      connect-timeout: 2s  # Wait up to 2 seconds to establish a connection
      host: localhost      # Connect to Redis on localhost
      port: 6379           # Use the default Redis port
      timeout: 1s          # Wait up to 1 second for a response
  security:
    oauth2:
      resourceserver:
        jwt:
          # The JWK (JSON Web Key) Set URI is used by Spring Security to fetch
          # public keys for JWT (JSON Web Token) validation.
          # Keycloak exposes this endpoint to provide cryptographic keys for token verification.
          jwk-set-uri: "http://localhost:7080/realms/master/protocol/openid-connect/certs"
          # Breakdown of the URI:
          # - `http://localhost:7080`: Keycloak server URL (default port for Keycloak is 8080, adjust if needed).
          # - `/realms/master`: The Keycloak realm (replace "master" with your realm name if different).
          # - `/protocol/openid-connect/certs`: Standard OIDC endpoint for JWKS (JSON Web Key Set).

######## Management Endpoints:
#
#  Exposes all Actuator endpoints over HTTP.
#
#  Allows unrestricted access to the /actuator/gateway endpoint.
#
#  Enables environment information in the /actuator/info endpoint.
management:
  endpoints:
    web:
      exposure:
        include: "*"  # Exposes all Actuator endpoints over HTTP. Use with caution in production.
        # This allows access to endpoints like `/actuator/health`, `/actuator/info`, `/actuator/gateway`, etc.

  endpoint:
    gateway:
      access: unrestricted  # Allows unrestricted access to the `/actuator/gateway` endpoint.
      # This endpoint provides information about the Gateway's routes and filters.

  info:
    env:
      enabled: true  # Enables the inclusion of environment information in the `/actuator/info` endpoint.
        # This includes details about the application's environment (e.g., system properties, environment variables).
  # Metrics-related settings (powered by Micrometer)
  metrics:
    # Tags (key-value pairs) attached to all collected metrics
    tags:
      # Adds an 'application' tag with the value of the service's name
      # This helps distinguish metrics in a multi-service environment
      application: ${spring.application.name}

######## Application Information:
#
#  Provides metadata about the application (name, description, version) for the /actuator/info endpoint.
info:
  app:
    name: "gatewayserver"  # Sets the application name for the `/actuator/info` endpoint.
    description: "Eazy Bank Gateway Server Application"  # Provides a description of the application.
    version: "1.0.0"  # Specifies the version of the application.
######## Logging:
#
#  Enables DEBUG-level logging for the org.example.gatewayserver package, which is useful for debugging the Gateway Server application.
logging:
  level:
    org:
      example:
        gatewayserver: DEBUG  # Sets the logging level for the `org.example.gatewayserver` package to DEBUG.
      springframework:
        security: DEBUG
        # This enables detailed logging for the Gateway Server application, which is useful for debugging.
  # Log Pattern Configuration
  # -------------------------
  pattern:
    # Customizes the log line format (using Logback/Log4j pattern syntax)
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
    # Pattern breakdown:
    #   %5p            - Right-padded log level (e.g., "DEBUG", "ERROR") with 5 chars
    #   ${spring.application.name} - Inserts the application name from Spring config
    #   %X{trace_id}   - Adds distributed tracing ID (from Sleuth/OpenTelemetry)
    #   %X{span_id}    - Adds span ID for tracing within a single request flow
    #
    # Example output:
    #   DEBUG [account-service,80f9ee446ccf34b4,80f9ee446ccf34b4] - Some log message

########## Resilience4j Circuit Breaker Configuration
#  - The circuit breaker monitors the last 10 calls (slidingWindowSize).
#  - If more than 50% of these calls fail (failureRateThreshold), the circuit breaker trips and enters the open state.
#  - In the open state, all calls are blocked for 10000 milliseconds (waitDurationInOpenState).
#  - After 10000 milliseconds, the circuit breaker transitions to the half-open state and allows 2 calls (permittedNumberOfCallsInHalfOpenState) to test if the service has recovered.
#   * If these calls succeed, the circuit breaker transitions back to the closed state.
#   * If they fail, it goes back to the open state
resilience4j:                # Root configuration for Resilience4j
  circuitbreaker:            # Configuration for the Circuit Breaker module
    configs:                 # Defines multiple circuit breaker configurations
      default:               # The name of this configuration (default configuration)
        slidingWindowSize: 10 # Number of calls to track in the sliding window (last 10 calls)
        permittedNumberOfCallsInHalfOpenState: 2 # Number of calls allowed in half-open state
        failureRateThreshold: 50 # Failure rate threshold (in %) to trip the circuit breaker
        waitDurationInOpenState: 10000 # Time (in ms) to wait in open state before testing recovery