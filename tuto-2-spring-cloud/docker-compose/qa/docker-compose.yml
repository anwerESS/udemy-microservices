  accountsdb:
    container_name: accountsdb
    ports:
      - 3306:3306 # noneed to expose the port (but it our case is needed because we use a client to connect to the db)
    environment:
      MYSQL_DATABASE: accountsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  loansdb:
    container_name: loansdb
    ports:
      - 3307:3306
    environment:
      MYSQL_DATABASE: loansdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  cardsdb:
    container_name: cardsdb
    ports:
      - 3308:3306
    environment:
      MYSQL_DATABASE: cardsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  eurekaserver:
    image: "anweress/eurekaserver:s12"
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
      OTEL_SERVICE_NAME: "eurekaserver"

  configserver:
    image: "anweress/configserver:s12"  # Uses a custom Docker image for the Config Server.
    container_name: configserver-ms  # Sets the container name to "configserver-ms".
    ports:
      - "8071:8071"  # Exposes port 8071 for the Config Server.
    #    depends_on:
    #      rabbit:
    #        condition: service_healthy  # Ensures the RabbitMQ service is healthy before starting.
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"  # Checks if the Config Server is ready.
      interval: 20s  # Runs the health check every 10 seconds.
      timeout: 5s  # Sets a 5-second timeout for the health check.
      retries: 10  # Retries the health check up to 10 times before marking the service as unhealthy.
      start_period: 10s  # Waits 10 seconds before starting health checks (to allow the Config Server to initialize).
    extends:
      file: common-config.yml  # Extends configuration from the `common-config.yml` file.
      service: microservice-base-config  # Uses the `microservice-base-config` configuration.
    environment:
      OTEL_SERVICE_NAME: "configserver"

  accounts:
    image: "anweress/accounts:s12"  # Uses a custom Docker image for the Accounts microservice.
    container_name: accounts-ms  # Sets the container name to "accounts-ms".
    #    ports:
    #      - "8080:8080"  # Exposes port 8080 for the Accounts microservice.
    depends_on:
      configserver:
        condition: service_healthy  # Ensures the Config Server is healthy before starting.
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "accounts"  # Sets the Spring application name to "accounts".
      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"
      OTEL_SERVICE_NAME: "accounts"

    extends:
      file: common-config.yml  # Extends configuration from the `common-config.yml` file.
      service: microservice-eureka-config  # Uses the `microservice-eureka-config` configuration.

  loans:
    image: "anweress/loans:s12"  # Uses a custom Docker image for the Loans microservice.
    container_name: loans-ms  # Sets the container name to "loans-ms".
    #    ports:
    #      - "8090:8090"  # Exposes port 8090 for the Loans microservice.
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy  # Ensures the Config Server is healthy before starting.
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "loans"  # Sets the Spring application name to "loans".
      SPRING_DATASOURCE_URL: "jdbc:mysql://loansdb:3306/loansdb" # must be 3306 and not 3307 because database start inside the docker network
      OTEL_SERVICE_NAME: "loans"

    extends:
      file: common-config.yml  # Extends configuration from the `common-config.yml` file.
      service: microservice-eureka-config  # Uses the `microservice-eureka-config` configuration.

  cards:
    image: "anweress/cards:s12"  # Uses a custom Docker image for the Cards microservice.
    container_name: cards-ms  # Sets the container name to "cards-ms".
    #    ports:
    #      - "9000:9000"  # Exposes port 9000 for the Cards microservice.
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy  # Ensures the Config Server is healthy before starting.
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "cards"  # Sets the Spring application name to "cards".
      SPRING_DATASOURCE_URL: "jdbc:mysql://cardsdb:3306/cardsdb" #  must be 3306 and not 3307 because database start inside the docker network
      OTEL_SERVICE_NAME: "cards"
    extends:
      file: common-config.yml  # Extends configuration from the `common-config.yml` file.
      service: microservice-eureka-config  # Uses the `microservice-eureka-config` configuration.

  gatewayserver:
    image: "anweress/gatewayserver:s12"
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    depends_on:
      accounts:
        condition: service_healthy
      loans:
        condition: service_healthy
      cards:
        condition: service_healthy
    #      redis:
    #        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gatewayserver"
      OTEL_SERVICE_NAME: "gatewayserver"
      #      SPRING_DATA_REDIS_CONNECT-TIMEOUT: 2s
      #      SPRING_DATA_REDIS_HOST: redis
      #      SPRING_DATA_REDIS_PORT: 6379
      #      SPRING_DATA_REDIS_TIMEOUT: 1s
      # Keycloak JWT validation endpoint:
      # - Fetches public keys to validate OAuth2 tokens.
      # - Uses Keycloak's Docker service name (`keycloak`) as host (internal DNS).
      # - Realm: `master` (change if using a custom realm).
      # (the port below is 8080 and not 7080 because 7080 is the port exposed to the outside world and the service invoked with its name 'keycloak:8080')
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"

    extends:
      file: common-config.yml
      service: microservice-eureka-config

networks:
  anweress:
    driver: "bridge"  # Creates a bridge network named "anweress" for communication between containers.