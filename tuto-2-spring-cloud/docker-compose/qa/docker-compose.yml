services:

  keycloak:
    # Official Keycloak Docker image from Red Hat's Quay.io registry.
    # Version 26.0.0 (adjust to your desired version for stability/features).
    image: quay.io/keycloak/keycloak:26.0.7
    # Explicitly sets the container name (useful for debugging/linking).
    container_name: keycloak
    # Port mapping:
    # - Host machine port `7080` → Container port `8080` (Keycloak's default HTTP port).
    # Access via `http://localhost:7080` on the host.
    ports:
      - "7080:8080"
    # Environment variables for initial setup:
    # - `KEYCLOAK_ADMIN`: Default admin username.
    # - `KEYCLOAK_ADMIN_PASSWORD`: Default admin password (change in production!).
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
    # Command to start Keycloak in development mode (`start-dev`):
    # - Auto-creates a default realm, users, and TLS disabled (HTTP only).
    # For production, use `start` with additional args (e.g., `--proxy edge` + HTTPS).
    command: "start-dev"
    # Extends configuration from an external YAML file (`common-config.yml`):
    # - Shares settings like networks, volumes, or dependencies defined in `network-deploy-service`.
    extends:
      file: common-config.yml
      service: network-deploy-service

  # Loki Read Component - Handles log queries
  # Exposes port 3101 for external query requests
  # Connects to MinIO for log storage retrieval
  read:
    image: grafana/loki:2.8.3
    command: "-config.file=/etc/loki/config.yaml -target=read"  # Runs in read-only mode
    ports:
      - 3101:3100  # External query endpoint
      - 7946       # Cluster memberlist port
      - 9095       # Metrics endpoint
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml  # Mount config file
    depends_on:
      - minio  # Requires storage backend
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 10
    networks: &loki-dns
      anweress:
        aliases:
          - loki  # DNS alias for service discovery

  # Loki Write Component - Handles log ingestion
  # Exposes port 3102 for log forwarding
  # Stores logs in MinIO object storage
  write:
    image: grafana/loki:2.8.3
    command: "-config.file=/etc/loki/config.yaml -target=write"  # Runs in write-only mode
    ports:
      - 3102:3100  # External write endpoint
      - 7946       # Cluster memberlist port
      - 9095       # Metrics endpoint
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml  # Mount config file
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 10
    depends_on:
      - minio  # Requires storage backend
    networks:
      <<: *loki-dns  # Inherits network config from read service

  # Promtail - Log collection agent
  # Scrapes Docker container logs and forwards to Loki
  # Requires access to Docker daemon socket
  promtail:
    image: grafana/promtail:2.8.3
    volumes:
      - ../observability/promtail/promtail-local-config.yaml:/etc/promtail/config.yaml:ro  # Read-only config
      - /var/run/docker.sock:/var/run/docker.sock  # Access to Docker API
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - gateway  # Requires gateway to be running
    extends:
      file: common-config.yml
      service: network-deploy-service
  # MinIO - S3-compatible object storage
  # Stores Loki log chunks and indexes
  # Pre-creates required buckets on startup
  #      mkdir -p /data/loki-data && \  # Main log storage
  #      mkdir -p /data/loki-ruler && \ # Alert rules storage
  #      minio server /data  # Start server
  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki  # Admin username
      - MINIO_ROOT_PASSWORD=supersecret  # Admin password
    volumes:
      - ./.data/minio:/data  # Persistent storage
    extends:
      file: common-config.yml
      service: network-deploy-service

  # Prometheus - Metrics aggregation and alerting
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extends:
      file: common-config.yml
      service: network-deploy-service

  # Tempo (Distributed Tracing Backend) Service Definition
  # ----------------------------------------------------
  # Part of Grafana's observability stack - stores and queries trace data
  tempo:
    # Base Configuration
    image: grafana/tempo:2.6.1  # Official Tempo Docker image (version pinned for stability)
    container_name: tempo       # Explicit container naming for easier management
    # Startup Command
    command: -config.file /etc/tempo-config.yml  # Specifies the configuration file location
    # Network Port Mapping
    ports:
      - "3110:3100"  # Maps host port 3110 → container port 3100 (Tempo's HTTP interface)
      # 3100 is the standard port for querying traces
      - "4317:4317"  # Maps host port 4318 → container port 4318 (OTLP HTTP receiver) (for bew version we should use 4318)
      # This is where applications send trace data via OpenTelemetry
    # Configuration Mount
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo-config.yml  # Mounts custom config file
      # The mounted file contains all Tempo settings (storage, retention, etc.)
      # Path is relative to the docker-compose file location
    # Shared Configuration
    extends:
      file: common-config.yml              # Inherits common settings from base config
      service: network-deploy-service      # Likely includes network/healthcheck settings

  # Grafana - Visualization dashboard
  # Auto-configures Loki datasource on startup
  # Exposes web UI on port 3000
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - |
        /run.sh
    ports:
      - "3000:3000"  # Web interface
    volumes:
      - ../observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 10
    extends:
      file: common-config.yml
      service: network-deploy-service

  # NGINX Gateway - Unified access point
  # Routes requests to appropriate Loki components
  # Provides load balancing and single endpoint
  gateway:
    image: nginx:1.27.3
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;

        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 20s
      timeout: 5s
      retries: 10
    extends:
      file: common-config.yml
      service: network-deploy-service

